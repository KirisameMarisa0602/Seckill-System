server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/seckill?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${DB_PASSWORD:123456}

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual

mybatis-plus:
  global-config:
    datacenter-id: ${DATACENTER_ID:1}
    worker-id: ${WORKER_ID:1}
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

alipay:
  gatewayUrl: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  appId: ${ALIPAY_APPID:123456}
  merchantPrivateKey: ${ALIPAY_PRIVATE_KEY:123456}
  alipayPublicKey: ${ALIPAY_PUBLIC_KEY:123456}
  notifyUrl: http://3f83fc91.r21.cpolar.top/pay/notify
  returnUrl: http://localhost:8080/success.html